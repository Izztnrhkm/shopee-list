# Deploys the app to Firebase Hosting (https://shopee-list-dea0e.firebaseapp.com) on every push to main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_SHOPEE_LIST: a service account key with the roles
# Firebase Hosting Admin, API Keys Viewer and Service Usage Consumer (see docs/OPERATIONS.md).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Logic tests
        run: node --test tests/logic.test.mjs
      - name: Stamp the version (the app shows "New version ready" when this changes)
        run: printf '{"version":"%s","builtAt":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHOPEE_LIST }}
          projectId: shopee-list-dea0e
          channelId: live
