<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // One address: the old GitHub Pages copy sends visitors (and import/invite links) to the main one.
    if (location.hostname === 'izztnrhkm.github.io') {
      location.replace('https://shopee-list-dea0e.firebaseapp.com/' + location.pathname.replace(/^\/shopee-list\/?/, '') + location.search + location.hash);
    }
  </script>
  <script>
    // Light or dark before the first paint (see js/theme.js): the saved choice, else the phone's.
    (function () {
      var t = null;
      try { t = localStorage.getItem('shopee-list-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shopee List</title>
  <meta name="description" content="Shopee Malaysia shopping lists with photos, the reason behind each pick, price history and a buy-next plan.">
  <meta name="theme-color" content="#e8572a">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Start every script download at once instead of one after another. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/importer.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="js/refresh.js">
  <link rel="modulepreload" href="js/fx.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js">
  <link rel="preconnect" href="https://firestore.googleapis.com">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img class="brand-logo" src="img/icon-64.png" alt="" width="32" height="32">Shopee List</a>
    <button id="refresh-btn" class="icon-btn refresh-btn" type="button" aria-label="Refresh the app" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button id="theme-btn" class="icon-btn theme-btn" type="button" data-sound="toggle" aria-label="Switch to dark mode" title="Light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></g>
        <path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <div id="header-user" class="header-user"></div>
  </header>
  <div id="ptr" class="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </div>
  <div id="update-pill" class="update-pill" role="status" hidden>
    <span>New version ready</span>
    <button type="button" data-sound="toggle">Refresh</button>
  </div>
  <main id="main" class="container" aria-live="polite">
    <!-- Shown until the app starts, so the first paint is the logo, not a blank page. -->
    <div class="center splash"><img class="signin-logo" src="img/logo-360.png" alt="Shopee List" width="180" height="180" fetchpriority="high"><div class="spinner" aria-hidden="true"></div></div>
    <noscript><p>This app needs JavaScript turned on.</p></noscript>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Main" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
